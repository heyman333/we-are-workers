:root{

const AREA_HINT = {'강남': '강남역', '판교': '판교', '분당': '분당', '강북': '종로', '광화문·시청': '광화문', '마포': '마포', '여의도': '여의도', '구디': '구로디지털단지', '가산': '가산디지털단지', '서울대입구': '서울대입구', '상암': '상암', '마곡': '마곡', '문정': '문정', '성수': '성수', '잠실': '잠실', '역삼': '역삼역', '선릉·삼성': '선릉', '용산': '용산'};
const searchQ = p => { const m = p.name.match(/^(.*?)\s*\((.+)\)$/); return m ? `${m[1]} ${m[2]}` : `${p.name} ${AREA_HINT[p.area]}`; };
const naverUrl = p => `https://map.naver.com/p/search/${encodeURIComponent(searchQ(p))}`;
// 'S' + 식신 pid 는 식신에서 모은 곳 — 카카오 장소 ID가 없어 카카오맵은 검색으로 연결
const fromSiksin = p => p.id[0] === 'S';
const kakaoUrl = p => fromSiksin(p) ? `https://map.kakao.com/link/search/${encodeURIComponent(p.name)}` : `https://place.map.kakao.com/${p.id}`;

const map = new kakao.maps.Map(document.getElementById('map'), {center: new kakao.maps.LatLng(37.4979, 127.0276), level: 4});
map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
// 클러스터링: 레벨 5 이상(넓게 볼 때)만 묶고, 누르면 그 묶음으로 확대. 개수에 따라 원 크기만 달라짐
const clusterStyle = n => ({width: n + 'px', height: n + 'px', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: '1', borderRadius: '50%',
  boxSizing: 'border-box', background: '#111', color: '#fff', fontFamily: 'Pretendard,sans-serif', fontSize: '13px', fontWeight: '600',
  border: '2px solid #fff', boxShadow: '0 0 0 3px rgba(255,106,13,.45), 0 2px 6px rgba(0,0,0,.25)'});   // font 축약은 line-height를 덮으니 쓰지 않음
const clusterer = new kakao.maps.MarkerClusterer({map, averageCenter: true, minLevel: 5, gridSize: 64,
  calculator: [10, 50], styles: [clusterStyle(32), clusterStyle(38), clusterStyle(46)]});
const label = new kakao.maps.CustomOverlay({yAnchor: 1, zIndex: 3});
const state = {area: '강남', cat: null, sort: 'price', selected: null, me: null, near: false, radius: 1000};
// 두 좌표 사이 거리(m) — 하버사인
const distM = (a, b) => { const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h)); };
const walkMin = m => Math.max(1, Math.round(m / 67));   // 도보 약 4km/h
const mePin = document.createElement('div'); mePin.className = 'me-pin'; mePin.textContent = '내 위치';
const meOverlay = new kakao.maps.CustomOverlay({content: mePin, yAnchor: 1.3, zIndex: 4});
const meCircle = new kakao.maps.Circle({strokeWeight: 1.5, strokeColor: '#FF6A0D', strokeOpacity: .9, fillColor: '#FF6A0D', fillOpacity: .06});

// 마커: 분류 색 점(CustomOverlay). 클릭하면 카드 선택.
places.forEach(p => {
  p.pos = new kakao.maps.LatLng(p.lat, p.lng);
  p.dot = document.createElement('div');
  p.dot.className = 'dot'; p.dot.style.setProperty('--c', color(p.cat)); p.dot.title = p.name;
  p.dot.onclick = () => select(p, true);
  p.overlay = new kakao.maps.CustomOverlay({position: p.pos, content: p.dot, yAnchor: .5, zIndex: p.cat === '커피' ? 1 : 2});
});

function chipRow(el, values, key, labelOf, cls = 'chip') {
  el.innerHTML = values.map(v => `<button class="${cls}" data-v="${v ?? ''}">${labelOf(v)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v || null; if (key === 'area') setNear(false); render(true); };
}
chipRow(document.getElementById('areas'), [...AREAS, null], 'area', v => v ?? '전체 지역', 'tab');
chipRow(document.getElementById('cats'), [null, ...Object.keys(CAT)], 'cat', v => v ? `<i style="background:${color(v)}"></i>${v}` : '전체');
chipRow(document.getElementById('sorts'), ['dist', 'price'], 'sort', v => v === 'dist' ? '가까운순' : '가격순', 'sort');
chipRow(document.getElementById('radius'), ['500', '1000', '2000'], 'radius', v => v === '500' ? '500m' : `${v / 1000}km`, 'rbtn');

// 내 위치 주변 — 브라우저 위치 권한으로 현재 위치를 받아 반경 안만 보여줌(저장하지 않음)
const meBtn = document.getElementById('meBtn');
function setNear(on) {
  state.near = on && !!state.me;
  if (state.near) state.sort = 'dist'; else if (state.sort === 'dist') state.sort = 'price';
}
function locate() {
  if (!navigator.geolocation) return alert('이 브라우저는 위치 기능을 지원하지 않아요.');
  meBtn.setAttribute('aria-busy', 'true'); meBtn.textContent = '위치 찾는 중…';
  const done = () => { meBtn.removeAttribute('aria-busy'); meBtn.textContent = '내 위치 주변'; };
  navigator.geolocation.getCurrentPosition(p => {
    done(); state.me = {lat: p.coords.latitude, lng: p.coords.longitude}; setNear(true); render(true);
  }, e => {
    done();
    alert(e.code === 1 ? '위치 권한이 꺼져 있어요. 주소창의 위치 권한을 허용한 뒤 다시 눌러 주세요.'
                       : '현재 위치를 가져오지 못했어요. 잠시 후 다시 시도해 주세요.');
  }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
}
meBtn.onclick = locate;   // 토글 아님 — 누를 때마다 현재 위치로 다시 이동
document.getElementById('meOff').onclick = () => { setNear(false); render(true); };

const list = document.getElementById('list');
list.onclick = e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('.card');
  if (el) select(places.find(p => p.id === el.dataset.id), false);
};

function select(p, fromMap) {
  document.querySelector('.card.on')?.classList.remove('on');
  state.selected?.dot.classList.remove('on');
  state.selected = p;
  p.dot.classList.add('on');
  const el = list.querySelector(`[data-id="${p.id}"]`);
  el?.classList.add('on');
  if (fromMap) el?.scrollIntoView({block: 'nearest'});
  // 모바일: 핀을 누르면 카드가 보이게, 카드를 누르면 지도가 보이게 시트를 절반으로
  if (mobile.matches && sheet.snap === (fromMap ? 'peek' : 'full')) setSnap('half');
  label.setContent(`<div class="label">${esc(p.name)}<em>${priceText(p)}</em></div>`);
  label.setPosition(p.pos); label.setMap(map);
  map.setLevel(Math.min(map.getLevel(), 3)); map.panTo(p.pos);
}

function render(refit) {
  const near = state.near && state.me;
  if (near) places.forEach(p => { p.dist = distM(state.me, p); });
  const inArea = near ? places.filter(p => p.dist <= state.radius) : places.filter(p => !state.area || p.area === state.area);
  // '전체'는 점심만. 커피는 커피 칩에서만(가격순에서 1,700원 커피가 점심 위로 올라오지 않게)
  const isCat = (p, c) => c ? p.cat === c : p.cat !== '커피';
  const shown = inArea.filter(p => isCat(p, state.cat))
    .sort(state.sort === 'dist' && near ? (a, b) => a.dist - b.dist
        : (a, b) => (a.min ?? 1e9) - (b.min ?? 1e9) || a.name.localeCompare(b.name, 'ko'));
  clusterer.clear(); clusterer.addMarkers(shown.map(p => p.overlay));
  label.setMap(null);
  for (const [id, k] of [['areas', 'area'], ['cats', 'cat'], ['sorts', 'sort'], ['radius', 'radius']])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', !(near && k === 'area') && (b.dataset.v || null) == state[k]));
  document.querySelector('#sorts [data-v="dist"]').hidden = !near;
  document.getElementById('nearbar').hidden = !near;
  if (near) {
    const c = new kakao.maps.LatLng(state.me.lat, state.me.lng);
    meOverlay.setPosition(c); meOverlay.setMap(map);
    meCircle.setPosition(c); meCircle.setRadius(+state.radius); meCircle.setMap(map);
  } else { meOverlay.setMap(null); meCircle.setMap(null); }
  // 분류 칩 개수는 현재 지역 기준
  document.querySelectorAll('#cats .chip').forEach(b => {
    const v = b.dataset.v, n = inArea.filter(p => isCat(p, v)).length;
    b.lastChild.textContent = v ? `${v} ${n}` : `점심 전체 ${n}`;
  });
  document.getElementById('count').innerHTML = `<b>${shown.length}</b>곳`;
  list.innerHTML = shown.map(p => `<article class="card" data-id="${p.id}" style="--c:${color(p.cat)}">
    <div class="row"><h2 class="name">${esc(p.name)}</h2><span class="price${p.min == null ? ' na' : ''}">${priceText(p)}</span></div>
    <div class="meta"><i></i>${esc(p.cat)} · ${near ? `도보 ${walkMin(p.dist)}분` : p.area}</div>
    <p class="menu">${esc(p.menu)}</p>
    <div class="links"><a href="${kakaoUrl(p)}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a>
      <a href="${naverUrl(p)}" target="_blank" rel="noopener">네이버맵에서 보기 ↗</a>${fromSiksin(p) ? `
      <a href="https://www.siksinhot.com/P/${p.id.slice(1)}" target="_blank" rel="noopener">식신에서 보기 ↗</a>` : ''}</div></article>`).join('') || `<p class="empty">${near ? `반경 ${state.radius >= 1000 ? state.radius / 1000 + 'km' : state.radius + 'm'} 안에 모아둔 곳이 없어요.<br>지금은 ${AREAS.join('·')} 주변만 들어 있어요.` : '조건에 맞는 곳이 없어요'}</p>`;
  if (refit && near) map.setBounds(meCircle.getBounds(), 40, 40, 40, 40);
  else if (refit && shown.length) {
    const b = new kakao.maps.LatLngBounds(); shown.forEach(p => b.extend(p.pos));
    map.setBounds(b, 60, 60, 60, 60);
  }
}
// 제보 안내 — 네이티브 dialog, 바깥 누르면 닫힘
const report = document.getElementById('report');
document.getElementById('reportBtn').onclick = () => report.showModal();
document.getElementById('reportClose').onclick = () => report.close();
report.onclick = e => { const r = report.getBoundingClientRect();   // 패딩 클릭은 무시, 바깥(backdrop)만 닫기
  if (e.target === report && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) report.close(); };
document.getElementById('reportCopy').onclick = async e => {
  try { await navigator.clipboard.writeText('gglife333@gmail.com'); e.target.textContent = '복사했어요'; }
  catch { e.target.textContent = '주소를 길게 눌러 복사해 주세요'; }
};

// 모바일 바텀시트 — 위로 끌면 리스트가 펼쳐지고, 아래로 내리면 지도가 넓어짐. 빠르게 튕기면 그 방향 다음 단계로.
const aside = document.querySelector('aside'), mapEl = document.getElementById('map');
const mobile = matchMedia('(max-width:767px)');
const TOP = 72, SNAPS = ['full', 'half', 'peek'];   // 시트가 가장 높이 올라왔을 때의 top(px)
const sheet = {snap: 'half'};
const snapY = s => s === 'full' ? TOP : s === 'half' ? Math.round(innerHeight * .5) : innerHeight - document.getElementById('cats').offsetTop;
const moveSheet = y => { aside.style.transform = `translateY(${y - TOP}px)`; };
function setSnap(s) {
  const y = snapY(s); sheet.snap = s;
  moveSheet(y);
  aside.style.paddingBottom = `${y - TOP}px`;            // 화면 밖으로 나간 만큼 리스트 높이를 줄여 끝까지 스크롤되게
  aside.classList.toggle('full', s === 'full');
  mapEl.style.height = `${y + 12}px`; map.relayout();   // 지도는 시트 위 영역만 — 핀·로고가 시트에 가리지 않게
}
function resetSheet() {
  aside.style.transform = aside.style.paddingBottom = mapEl.style.height = ''; aside.classList.remove('full'); map.relayout();
}
let drag = null;
aside.addEventListener('pointerdown', e => {
  if (!mobile.matches || e.button > 0 || (sheet.snap === 'full' && e.target.closest('.list'))) return;
  drag = {x0: e.clientX, y0: e.clientY, top: snapY(sheet.snap), y: e.clientY, t: e.timeStamp, v: 0, moving: false};
});
aside.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (!drag.moving) {
    if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(e.clientX - drag.x0)) return;
    drag.moving = true; aside.classList.add('dragging'); aside.setPointerCapture(e.pointerId);
  }
  drag.v = (e.clientY - drag.y) / Math.max(1, e.timeStamp - drag.t); drag.y = e.clientY; drag.t = e.timeStamp;
  moveSheet(Math.min(Math.max(drag.top + dy, TOP), snapY('peek')));
});
function endDrag() {
  const d = drag; drag = null;
  if (!d?.moving) return;
  aside.classList.remove('dragging');
  const y = d.top + d.y - d.y0;
  let s = SNAPS.reduce((a, b) => Math.abs(snapY(b) - y) < Math.abs(snapY(a) - y) ? b : a);
  if (d.v > .5) s = SNAPS.find(k => snapY(k) > y) ?? 'peek';
  else if (d.v < -.5) s = SNAPS.findLast(k => snapY(k) < y) ?? 'full';
  setSnap(s);
}
aside.addEventListener('pointerup', endDrag);
aside.addEventListener('pointercancel', endDrag);
mobile.addEventListener('change', () => mobile.matches ? setSnap(sheet.snap) : resetSheet());
addEventListener('resize', () => { if (mobile.matches && !drag) setSnap(sheet.snap); });
if (mobile.matches) setSnap('half');

render(true);
// 지도 영역 크기가 늦게 잡히면(탭·패널 전환) 처음 크기가 생길 때 한 번 다시 맞춤
new ResizeObserver(([e], ob) => { if (e.contentRect.width) { ob.disconnect(); map.relayout(); render(true); } })
  .observe(document.getElementById('map'));
</script></body></html>
